name: Deploy to GitHub Pages

# main에 푸시할 때마다 자동으로 빌드해서 배포한다.
# Actions 탭에서 "Run workflow" 버튼으로 직접 돌릴 수도 있다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않도록 한 번에 하나만 실행
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # GitHub Pages에는 서버가 없어서 /redmoon/grid 같은 주소로 바로 들어오면 404가 난다.
      # 404 화면을 index.html과 같게 만들어두면 앱이 대신 해당 페이지를 그려준다.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
